---
- name: Nginx with Handler
  hosts: web
  become: yes

  tasks:
    - name: Update web page
      copy:
        content: "<h1>Handler Triggered!</h1>"
        dest: /var/www/html/index.html
      notify: Restart nginx

  handlers:
    - name: Restart nginx
      service:
        name: nginx
        state: restarted

