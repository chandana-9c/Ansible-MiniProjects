---
- name: User and Package Management
  hosts: web
  become: yes

  vars:
    username: devuser
    packages:
      - git
      - curl
      - vim

  tasks:
    - name: Create user
      user:
        name: "{{ username }}"
        state: present

    - name: Install packages
      apt:
        name: "{{ packages }}"
        state: present
        update_cache: yes

